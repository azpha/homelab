# need to redeploy
---
- name: Deploy Radarr
  include_role:
    name: docker
  vars:
    name: servarr_radarr
    directories:
      - "{{ data_dir }}/servarr"
      - "{{ data_dir }}/servarr/sonarr_config"
      - "{{ data_dir }}/servarr/radarr_config"
      - "{{ data_dir }}/servarr/lidarr_config"
    image:
      name: lscr.io/linuxserver/radarr
      tag: latest
    volumes:
      - "{{ data_dir }}/servarr/radarr_config:/config"
      - "{{ media_path }}:/media"
      - "{{ media_path }}/Downloads:/downloads"
    networks:
      - name: homelab
    env:
      PUID: "1000"
      PGID: "1000"
      TZ: "{{ TZ }}"
    labels:
      traefik.enable: "true"
      traefik.http.routers.radarr.rule: Host(`radarr.fntz.net`)
      traefik.http.routers.radarr.entrypoints: webSecure
      traefik.http.routers.radarr.tls.certresolver: letsencrypt
      traefik.http.services.radarr.loadbalancer.server.port: "7878"

- name: Deploy Sonarr
  include_role:
    name: docker
  vars:
    name: servarr_sonarr
    image:
      name: lscr.io/linuxserver/sonarr
      tag: latest
    volumes:
      - "{{ data_dir }}/servarr/sonarr_config:/config"
      - "{{ media_path }}:/data"
      - "{{ media_path }}/Downloads:/downloads"
    env:
      PUID: "1000"
      PGID: "1000"
      TZ: "{{ TZ }}"
    networks:
      - name: homelab
    labels:
      traefik.enable: "true"
      traefik.http.routers.sonarr.rule: Host(`sonarr.fntz.net`)
      traefik.http.routers.sonarr.entrypoints: webSecure
      traefik.http.routers.sonarr.tls.certresolver: letsencrypt
      traefik.http.services.sonarr.loadbalancer.server.port: "8989"
