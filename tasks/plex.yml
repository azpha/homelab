---
- name: Deploy Plex
  include_role:
    name: docker
  vars:
    name: plex
    image:
      name: lscr.io/linuxserver/plex
      tag: latest
    networks:
      - name: homelab
    devices:
      - /dev/dri:/dev/dri
    env:
      PUID: "1000"
      PGID: "1000"
      TZ: "{{ TZ }}"
      VERSION: "docker"
      PLEX_CLAIM: "{{ PLEX_CLAIM_TOKEN }}"
    volumes:
      - "{{ data_dir }}/plex:/config"
      - "{{ media_path }}:/media"
