---
- name: Deploy NC MariaDB
  include_role:
    name: docker
  vars:
    name: nextcloud_mariadb
    network_name: nextcloud
    directories:
      - "{{ data_dir }}/nextcloud/data"
      - "{{ data_dir }}/nextcloud/mariadb/data"
      - "{{ data_dir }}/nextcloud/mariadb/conf.d"
      - "{{ data_dir }}/nextcloud/mariadb/import"
    image:
      name: mariadb
      tag: "11.4"
    command: "--transaction-isolation=READ-COMMITTED --binlog-format=ROW"
    networks:
      - name: "nextcloud"
    volumes:
      - "{{ data_dir }}/nextcloud/mariadb/data:/var/lib/mysql"
      - "{{ data_dir }}/nextcloud/mariadb/conf.d:/etc/mysql/conf.d"
      - "{{ data_dir }}/nextcloud/mariadb/import:/mnt/import"
    env:
      MARIADB_USER: "nextcloud"
      MARIADB_DATABASE: "nextcloud"
      MARIADB_PASSWORD: "{{ NEXTCLOUD_MYSQL_PASSWORD }}"
      MARIADB_ROOT_PASSWORD: "{{ NEXTCLOUD_MYSQL_ROOT_PASSWORD }}"

- name: Deploy Nextcloud
  include_role:
    name: docker
  vars:
    name: "nextcloud"
    image:
      name: nextcloud
      tag: latest
    networks:
      - name: "{{ docker_network_name }}"
      - name: nextcloud
    volumes:
      - "{{ data_dir }}/nextcloud/data:/var/www/html"
    env:
      TZ: "{{ TZ }}"
      MYSQL_PASSWORD: "{{ NEXTCLOUD_MYSQL_PASSWORD }}"
      MYSQL_DATABASE: "nextcloud"
      MYSQL_USER: "nextcloud"
    labels:
      traefik.enable: "true"
      traefik.http.routers.nc.rule: Host(`{{ NEXTCLOUD_APP_URL }}`)
      traefik.http.routers.nc.entrypoints: webSecure
      traefik.http.routers.nc.tls.certresolver: letsencrypt
      traefik.http.services.nc.loadbalancer.server.port: "80"
