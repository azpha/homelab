---
- name: Deploy API Database
  include_role:
    name: docker
  vars:
    name: api_postgres
    network_name: api
    directories:
      - "{{ data_dir }}/api/db"
    image:
      name: postgres
      tag: "17"
    networks:
      - name: api
    volumes:
      - "{{ data_dir }}/api/db:/var/lib/postgresql/data"
    env:
      POSTGRES_USER: "api"
      POSTGRES_PASSWORD: "{{ API_POSTGRES_PASSWORD }}"
      PGDATA: "/var/lib/postgresql/data/pgdata"

- name: Deploy API Redis
  include_role:
    name: docker
  vars:
    name: api_redis
    networks:
      - name: api
    image:
      name: redis
      tag: latest

- name: Deploy Cloudflared
  include_role:
    name: docker
  vars:
    name: api_cloudflared
    command: "tunnel run"
    image:
      name: cloudflare/cloudflared
      tag: latest
    networks:
      - name: api
    env:
      TUNNEL_TOKEN: "{{ API_CLOUDFLARED_TOKEN }}"

- name: Deploy API
  include_role:
    name: docker
  vars:
    name: api
    network_name: api
    networks:
      - name: api
    image:
      name: git.alexav.gg/alex/api
      tag: latest
    env:
      NODE_ENV: "production"
      VERSION: "v4"
      REDIS_URL: "redis://api_redis:6379"
      ADMIN_KEY: "{{ API_ADMIN_KEY }}"
      DATABASE_URL: "{{ API_DATABASE_URL }}"
      LASTFM_API_KEY: "{{ API_LASTFM_API_KEY }}"
      STEAM_API_KEY: "{{ API_STEAM_API_KEY }}"
      JWT_KEY: "{{ API_JWT_KEY }}"
      DISCORD_PUBLIC_KEY: "{{ API_DISCORD_PUBLIC_KEY }}"
      DISCORD_APP_ID: "{{ API_DISCORD_APP_ID }}"
      DISCORD_BOT_TOKEN: "{{ API_DISCORD_BOT_TOKEN }}"
      TMDB_API_KEY: "{{ API_TMDB_TOKEN }}"
      STORAGE_KEY: "{{ API_STORAGE_KEY }}"
